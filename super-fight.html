<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>超级对决 SUPER FIGHT · V0.5.0</title>
<style>
:root{
  --bg:#0b1020;
  --panel:#121a2e;
  --panel2:#17223b;
  --panel3:#0f1730;
  --text:#f8fbff;
  --text2:#dce7ff;
  --muted:#aebcda;
  --line:#334365;
  --accent:#8aa5ff;
  --accent2:#b78cff;
  --good:#68e0a2;
  --warn:#ffd477;
  --bad:#ff98a4;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#0a1020,#0c1326 30%,#111831);
  min-height:100vh;
}
body,button,input,select,textarea,table,th,td,label,summary,a,option{
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--text);text-decoration:none}
option{background:#10172b}
::placeholder{color:#8292b5}
.hidden{display:none!important}
.app{min-height:100vh}
.nav{
  position:sticky;top:0;z-index:30;height:68px;
  display:flex;align-items:center;gap:18px;padding:0 24px;
  background:rgba(8,13,26,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)
}
.brand{font-weight:900;letter-spacing:.06em;white-space:nowrap;color:var(--text)}
.brand span{color:var(--accent)}
.navlinks{display:flex;gap:8px;flex:1;overflow:auto}
.nav a{padding:9px 11px;border-radius:10px;color:var(--muted);font-size:14px}
.nav a.active,.nav a:hover{background:var(--panel2);color:var(--text)}
.navright{display:flex;gap:8px}
.wrap{max-width:1440px;margin:0 auto;padding:28px}
.hero{display:flex;justify-content:space-between;gap:28px;align-items:flex-start;margin-bottom:24px}
h1,h2,h3,h4,strong,b{color:var(--text)}
h1{font-size:34px;line-height:1.08;margin:0 0 10px}
h2{font-size:22px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
h4{font-size:14px;margin:0 0 8px}
p{color:var(--muted);line-height:1.65}
.grid{display:grid;gap:16px}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.card{
  background:linear-gradient(180deg,rgba(23,34,59,.96),rgba(16,24,43,.96));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  color:var(--text)
}
.card.soft{box-shadow:none;background:rgba(18,26,46,.84)}
.stat{font-size:30px;font-weight:800;color:var(--text)}
.muted{color:var(--muted)!important}
.small{font-size:13px}
.btn{
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  background:var(--panel2);color:var(--text);font-weight:700
}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#6e8cff,#9d78ff);border:0;color:#fff}
.btn.good{background:#183f33;border-color:#2f7c5d;color:#f2fff7}
.btn.warn{background:#4b3d1a;border-color:#92752d;color:#fff7d6}
.btn.bad{background:#4b2028;border-color:#8d3c49;color:#fff2f4}
.btn.ghost{background:transparent;color:var(--text2)}
.btn.big{padding:14px 18px;font-size:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.space{justify-content:space-between}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;
  background:#202b49;color:#eef3ff;font-size:12px;border:1px solid #435477
}
.clickable{cursor:pointer}
.clickable:hover{text-decoration:underline;text-underline-offset:3px}
.badge.clickable:hover{border-color:var(--accent);text-decoration:none}
.badge.gold{background:#5b4618;border-color:#aa8632;color:#fff0a6}
.badge.silver{background:#374356;border-color:#6c7c98;color:#f5f8ff}
.badge.prismatic{background:#44335f;border-color:#8364b8;color:#f1e7ff}
.badge.cursed{background:#5a2436;border-color:#a14763;color:#ffdce4}
.badge.bronze{background:#3a2c22;border-color:#8a6a4a;color:#f2e3d2}
.badge.quest{background:#164a40;border-color:#337f71;color:#c8fff4}
.badge.active{outline:2px solid var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{
  padding:12px 14px;border-radius:12px;background:#10182b;border:1px solid var(--line);
  color:var(--text)
}
.item.active{outline:2px solid var(--accent)}
.kbd{padding:2px 7px;border-radius:6px;background:#0a1120;border:1px solid #435477;color:#e8efff}
input,select,textarea{
  width:100%;background:#0d1629;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:#d1dcf4;margin-bottom:6px}
.field{margin-bottom:14px}
.progress{height:8px;border-radius:99px;background:#0c1425;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#6d8cff,#aa6eff)}
.setup{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
.steps{display:flex;gap:8px;margin:12px 0 20px;overflow:auto}
.step{padding:8px 11px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.step.on{background:#1a2b53;color:#fff;border-color:#5b76b0}
.sticky{position:sticky;top:88px;align-self:start}
.live-layout{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:14px}
.fighter{min-height:310px}
.fighter .name{font-size:28px;font-weight:900;color:#fff}
.arena{
  min-height:310px;
  background:radial-gradient(circle at 50% 10%,rgba(113,137,255,.18),transparent 45%),linear-gradient(180deg,#182442,#10182c)
}
.timer{font-size:64px;font-weight:900;letter-spacing:.04em;color:#fff}
.dualtimer{display:flex;gap:26px;justify-content:center;align-items:flex-start}
.dtcol{opacity:.45;transition:opacity .15s}
.dtcol .timer{font-size:52px}
.dtcol.on{opacity:1}
.dtcol.on .dtlabel{color:var(--accent)}
.dtlabel{font-size:13px;font-weight:700;color:#9fb0d8;letter-spacing:.1em}
.dtgrp{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:9px}
.dtgrp input{background:#10182e;border:1px solid var(--line);color:#eef3ff;border-radius:6px;padding:5px 6px;width:56px;font-size:13px}
.dtgrp b{font-size:13px}
.segrow.dragging{opacity:.5;outline:2px dashed var(--accent)}
.drag-handle{cursor:grab;color:#8fa3cc;font-size:18px;line-height:1;user-select:none;padding-top:2px}
.segname{background:#10182e;border:1px solid var(--line);color:#eef3ff;border-radius:6px;padding:5px 8px;font-size:14px;font-weight:700;min-width:120px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:14px}
.center{text-align:center}
.control{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.timeline{display:flex;gap:8px;overflow:auto;margin-top:14px;padding-bottom:4px}
.node{
  min-width:150px;padding:10px;border-radius:11px;border:1px solid var(--line);
  background:#0c1425;color:var(--text)
}
.node.current{border-color:var(--accent);background:#17264e}
.node.done{opacity:.58}
.hexes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hex{
  padding:16px;border-radius:15px;background:#101a31;border:1px solid var(--line);min-height:210px;
  display:flex;flex-direction:column;color:var(--text);text-align:left
}
.hex.selected{outline:3px solid var(--accent)}
.hex .name{font-size:20px;font-weight:900;margin:10px 0 8px;color:#fff}
.hex .effect{color:#d8e3fa;line-height:1.5;flex:1}
.overlay{
  position:fixed;inset:0;background:#050913;z-index:50;
  display:flex;align-items:center;justify-content:center;padding:24px
}
.modal{
  max-width:900px;width:100%;background:#101a31;border:1px solid #435477;border-radius:24px;
  padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.55);color:var(--text)
}
.score{font-size:56px;font-weight:900;color:#fff}
.table{width:100%;border-collapse:collapse;color:var(--text)}
.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top;color:var(--text2)}
.table th{color:#c6d4f2}
.drawer{
  position:fixed;top:68px;right:0;bottom:0;width:min(520px,96vw);background:#0d1628;
  border-left:1px solid var(--line);z-index:40;padding:22px;overflow:auto;box-shadow:-30px 0 70px rgba(0,0,0,.35);color:var(--text)
}
.toast{
  position:fixed;right:20px;bottom:20px;background:#14213b;border:1px solid #485b81;
  padding:12px 16px;border-radius:12px;z-index:70;box-shadow:var(--shadow);color:#fff
}
.help-section{margin-bottom:18px}
.help-section h2{margin-bottom:8px}
.help-step{
  display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;
  padding:14px;border-radius:14px;background:#0f1930;border:1px solid var(--line)
}
.help-num{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#6e8cff,#9d78ff);font-weight:900;color:#fff
}
.callout{
  padding:14px 16px;border-radius:14px;background:#182341;border:1px solid #4a5e86;color:#eef4ff
}
.logline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#dce7ff}

.image-slot{
  min-height:150px;border:1px dashed #5b6f9b;border-radius:14px;background:#0c1427;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  color:var(--muted);text-align:center;padding:14px;overflow:hidden
}
.image-slot img{width:100%;height:180px;object-fit:cover;border-radius:10px;display:block}
.image-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.state-pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#1a2848;border:1px solid #43577f;font-size:12px;color:#eef4ff}
.reveal-board{display:grid;grid-template-columns:1fr 1fr;gap:16px}


.import-help{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0f1930;margin-top:12px}
.pool-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pool-stat{padding:8px;border:1px solid var(--line);border-radius:10px;background:#0c1427;font-size:12px}
@media(max-width:700px){.pool-stat-grid{grid-template-columns:repeat(2,1fr)}}


.detail-card{background:#0e1830;border:1px solid var(--line);border-radius:16px;padding:16px}
.detail-card h3{margin-bottom:6px}
.detail-label{font-size:12px;color:var(--muted);margin-bottom:4px}
.detail-text{color:var(--text2);line-height:1.65}
.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.confirm-public{grid-column:1/-1}
.rule-box{padding:14px 16px;border-radius:14px;background:#111c35;border:1px solid #42577e}
.rule-box h3{margin-bottom:6px}
.quick-check{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick-check .item{min-height:120px}
.help-toc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.help-toc a{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#111a30;color:var(--text)}
@media(max-width:900px){.confirm-grid,.quick-check{grid-template-columns:1fr}.confirm-public{grid-column:auto}}

@media(max-width:1000px){
 .grid.cols-4,.grid.cols-3{grid-template-columns:repeat(2,1fr)}
 .setup,.live-layout{grid-template-columns:1fr}
 .sticky{position:static}
 .nav{padding:0 12px}.navright{display:none}.wrap{padding:18px}
}
@media(max-width:760px){
 .grid.cols-4,.grid.cols-3,.grid.cols-2,.hexes{grid-template-columns:1fr}
 .timer{font-size:46px}.hero{flex-direction:column}.topbar{grid-template-columns:1fr}
 .navlinks{gap:3px}.nav a{padding:8px}
}
.app-footer{margin-top:28px;padding:16px 0 6px;border-top:1px solid #223;color:rgba(255,255,255,.5);font-size:12px;line-height:1.7}
.app-footer a{color:#6cf;text-decoration:none}
.app-footer .sep{opacity:.4;margin:0 6px}
.proj-watermark{position:fixed;right:14px;bottom:10px;font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.28);pointer-events:none;z-index:50;user-select:none}
.about-card{margin-top:16px}
</style>

// 媒体解析缓存：media 库中以 Blob 存储，渲染时用 object URL 引用（避免 base64 内联进对局数据）
const _mediaUrlCache=new Map();
// 历史内联 data: 媒体懒迁移为 Blob 入库（无网络/无 IDB 环境下 data: 仍可直显，故失败即回退）
function dataUrlToBlob(dataUrl){const [head,b64]=String(dataUrl).split(",");const mime=(head.match(/data:([^;]+)/)||[])[1]||"image/png";const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return new Blob([u8],{type:mime})}
function blobToDataUrl(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)})}
function mediaUrl(v){if(!v)return null;if(v.startsWith("data:"))return v;return _mediaUrlCache.get(v)||null}
async function hydrateMedia(m){if(!m||!m.media)return;for(const k of ["characterA","characterB","environment"]){const v=m.media[k];if(!v)continue;if(v.startsWith("data:")){try{const id="MID-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);const blob=dataUrlToBlob(v);await db.putMedia(id,blob);m.media[k]=id;_mediaUrlCache.set(id,URL.createObjectURL(blob));await service.save(m)}catch(e){}}else if(!_mediaUrlCache.has(v)){try{const blob=await db.getMedia(v);if(blob)_mediaUrlCache.set(v,URL.createObjectURL(blob))}catch(e){}}}}

// IndexedDB 迁移映射：每条迁移只「新增」，绝不删除旧库/旧数据。改 schema 必须 version+1 并追加一条迁移函数。
const DB_MIGRATIONS={
 1(d){
  if(!d.objectStoreNames.contains("content")){const s=d.createObjectStore("content",{keyPath:"key"});s.createIndex("type","type")}
  if(!d.objectStoreNames.contains("matches"))d.createObjectStore("matches",{keyPath:"id"});
  if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"key"});
 },
 2(d){
  if(!d.objectStoreNames.contains("media"))d.createObjectStore("media",{keyPath:"id"});
 }
};
const db={
 name:"super-fight-v04",version:2,conn:null,_staleNotified:false,
 async open(){
  if(this.conn)return this.conn;
  this.conn=await this._connect();
  return this.conn
 },
 _request(ver){
  return new Promise((resolve,reject)=>{
   const r=ver==null?indexedDB.open(this.name):indexedDB.open(this.name,ver);
   r.onupgradeneeded=()=>{
    const d=r.result;
    for(let v=(r.oldVersion||0)+1;v<=(r.newVersion||this.version);v++){if(DB_MIGRATIONS[v])DB_MIGRATIONS[v](d)}
   };
   r.onblocked=()=>{toast("数据库结构升级中，请刷新其它已打开的本工具标签页")};
   r.onsuccess=()=>{const conn=r.result;conn.onversionchange=()=>{try{conn.close()}catch{};db.conn=null};resolve(conn)};
   r.onerror=()=>reject(r.error)
  })
 },
 async _connect(){
  try{return await this._request(this.version)}
  catch(e){
   // 数据库已被更新版本升级（requested < existing）：不强行降级，改连当前版本并一次性提示刷新。
   // 迁移只增不删，旧代码读写的 store 在新 schema 中仍存在，故重连后旧页可继续使用而非静默丢持久化。
   if(e&&e.name==="VersionError"){
    const conn=await this._request(null);
    this.version=conn.version;
    if(!this._staleNotified){this._staleNotified=true;try{toast("数据库已由新版本升级，建议刷新本页获取最新功能")}catch{}}
    return conn
   }
   throw e
  }
 },
 async tx(store,mode,fn){
  const d=await this.open();
  return new Promise((resolve,reject)=>{
   const tx=d.transaction(store,mode),os=tx.objectStore(store);
   let val;
   try{val=fn(os)}catch(e){reject(e);return}
   tx.oncomplete=()=>resolve(val);tx.onerror=()=>reject(tx.error)
  })
 },
 async put(store,val){await this.tx(store,"readwrite",os=>os.put(val))},
 async del(store,key){await this.tx(store,"readwrite",os=>os.delete(key))},
 async putMedia(id,blob){await this.put("media",{id,blob})},
 async getMedia(id){const d=await this.get("media",id);return d?d.blob:null},
 async delMedia(id){try{await this.del("media",id)}catch{}},
 async getAll(store){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async get(store,key){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
};

 }

const randomService={
 hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0},
 rng(seed){let x=this.hash(seed)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%100000)/100000}},
 pick(arr,seed){if(!arr.length)return null;return arr[Math.floor(this.rng(seed)()*arr.length)]},
 shuffle(arr,seed){const r=this.rng(seed);return arr.map(v=>({v,n:r()})).sort((a,b)=>a.n-b.n).map(x=>x.v)},
 weighted(arr,seed){if(!arr.length)return null;const r=this.rng(seed),total=arr.reduce((s,x)=>s+(Number(x.weight)||1),0);let n=r()*total;for(const x of arr){n-=Number(x.weight)||1;if(n<=0)return x}return arr[arr.length-1]},
 weightedSample(arr,count,seed){
  const pool=[...arr],out=[];
  for(let i=0;i<count&&pool.length;i++){
   const picked=this.weighted(pool,seed+"|"+i);out.push(picked);pool.splice(pool.indexOf(picked),1)
  }
  return out
 }
};

const poolService={
 normalizeIdsByType(p,type){
  if(p.contentIdsByType && Array.isArray(p.contentIdsByType[type]))return p.contentIdsByType[type];
  if(Array.isArray(p.includedIds)&&p.includedIds.length)return p.includedIds.filter(id=>String(id).startsWith(TYPE_META[type].prefix));
  return null
 },
 exclusionsByType(p,type){
  if(p.excludedIdsByType && Array.isArray(p.excludedIdsByType[type]))return p.excludedIdsByType[type];
  if(Array.isArray(p.excludedIds))return p.excludedIds.filter(id=>String(id).startsWith(TYPE_META[type].prefix));
  return []
 },
 tagsByType(p,type){
  if(p.tagFiltersByType && Array.isArray(p.tagFiltersByType[type]))return p.tagFiltersByType[type];
  return Array.isArray(p.tagFilters)?p.tagFilters:[]
 },
 selectedPools(poolIds){
  const ids=Array.isArray(poolIds)?poolIds:[poolIds].filter(Boolean);
  return ids.map(id=>store.content("pools").find(p=>p.id===id&&p.enabled!==false)).filter(Boolean)
 },
 active(type,poolIds){
  const all=store.content(type).filter(x=>x.enabled!==false);
  const pools=this.selectedPools(poolIds);
  if(!pools.length)return all;
  const result=new Map();
  for(const p of pools){
   const explicit=this.normalizeIdsByType(p,type);
   let arr;
   if(p.scopeMode==="ALL" || explicit===null)arr=[...all];
   else arr=all.filter(x=>explicit.includes(x.id));
   const excluded=new Set(this.exclusionsByType(p,type));
   if(excluded.size)arr=arr.filter(x=>!excluded.has(x.id));
   const tags=this.tagsByType(p,type);
   if(tags.length)arr=arr.filter(x=>tags.some(t=>(x.tags||[]).includes(t)));
   arr.forEach(x=>result.set(x.id,x))
  }
  return [...result.values()]
 },
 membershipSummary(p){
  const out={};
  for(const type of ["characters","abilities","weaknesses","environments","victories","hexes"]){
   const ids=this.normalizeIdsByType(p,type);
   out[type]=p.scopeMode==="ALL"||ids===null?"ALL":ids.length
  }
  return out

function buildPreview(seed,poolIds){
 const pick=(type,key)=>randomService.weighted(poolService.active(type,poolIds),seed+"|"+key);
 const chars=poolService.active("characters",poolIds),aChar=pick("characters","A-c"),bChar=randomService.pick(chars.filter(x=>x.id!==aChar?.id).length?chars.filter(x=>x.id!==aChar?.id):chars,seed+"|B-c");
 const abilities=poolService.active("abilities",poolIds),weaknesses=poolService.active("weaknesses",poolIds);
 const aAbility=pick("abilities","A-a"),aWeak=pick("weaknesses","A-w");
 const bAbility=randomService.pick(abilities.filter(x=>x.id!==aAbility?.id).length?abilities.filter(x=>x.id!==aAbility?.id):abilities,seed+"|B-a");
 const bWeak=randomService.pick(weaknesses.filter(x=>x.id!==aWeak?.id).length?weaknesses.filter(x=>x.id!==aWeak?.id):weaknesses,seed+"|B-w");
 return {A:{character:aChar,ability:aAbility,weakness:aWeak},B:{character:bChar,ability:bAbility,weakness:bWeak},environment:pick("environments","env"),victory:pick("victories","v")}
}

// 通用 CHOICE 选择器框架（P0）：按 choiceSchema.type 路由，支持 min/max 与 SELECT_OPTION 选项数组。
// 已实现类型：SELECT_OWN_ABILITY（自动取己方能力）、SELECT_OPTION、SELECT_ENVIRONMENT_TAG、SELECT_ENVIRONMENT_HAZARD。
// 场景实体类（SCENE_TARGET/OBJECT/ZONE、OWN_RESOURCE）需 P2 场景实体模型，暂未实现。
function choiceSchemaOf(h){if(!h||h.effectMode!=="CHOICE")return null;return h.choiceSchema||{type:"SELECT_OWN_ABILITY",min:1,max:1}}
function choiceOptions(schema,m,a){
  if(!schema)return [];
  const et=m.environment||{};
  if(schema.type==="SELECT_OWN_ABILITY")return [{value:m.players[a].ability.id,label:m.players[a].ability.name}];
  if(schema.type==="SELECT_OPTION")return (schema.options||[]).map(v=>({value:v,label:v}));
  if(schema.type==="SELECT_ENVIRONMENT_TAG")return (et.tags||[]).map(t=>({value:t,label:t}));
  if(schema.type==="SELECT_ENVIRONMENT_HAZARD")return (et.hazards||[]).map(hz=>({value:hz,label:hz}));
  return []
}
function chooseHex(idx){
  const o=ui.overlay;const h=o.pool[idx];if(!h)return;
  o.selected=idx;o.choice=null;o.choices=[];o._opts=null;
  const cs=choiceSchemaOf(h);
  if(cs&&cs.type!=="SELECT_OWN_ABILITY"){
    const opts=choiceOptions(cs,match(),o.actor);
    o._opts=opts.map(x=>x.value);
    if((cs.max||1)<=1&&opts.length)o.choice=opts[0].value   // 单选默认取首项，避免无选择即锁定的歧义
  }
  render()
}
function selectChoice(i){const o=ui.overlay;o.choice=o._opts?o._opts[i]:null;render()}
function toggleChoice(i){const o=ui.overlay;if(!o._opts)return;const v=o._opts[i];o.choices=o.choices||[];const k=o.choices.indexOf(v);if(k>=0)o.choices.splice(k,1);else o.choices.push(v);render()}
function choicePanelHTML(o){
  const h=o.pool[o.selected],cs=choiceSchemaOf(h);if(!cs)return "";
  if(cs.type==="SELECT_OWN_ABILITY")return `<div class="callout" style="margin:14px 0">本海克斯将作用于你已拥有的能力：<b>${esc(match().players[o.actor].ability.name)}</b>。</div>`;
  const opts=choiceOptions(cs,match(),o.actor);
  if(!opts.length)return `<div class="callout" style="margin:14px 0">⚠ 当前环境没有可供 <b>${cs.type}</b> 选择的项目；锁定后将不记录具体选择。</div>`;
  const multi=(cs.max||1)>1,sel=multi?(o.choices||[]):(o.choice!=null?[o.choice]:[]);
  const btns=opts.map((op,i)=>`<button class="btn ${sel.includes(op.value)?"primary":""}" onclick="${multi?`toggleChoice(${i})`:`selectChoice(${i})`}">${esc(op.label)}</button>`).join("");
  return `<div class="card" style="margin:14px 0"><h3>请选择（${cs.type}）</h3><div class="row wrap">${btns}</div><div class="small muted" style="margin-top:8px">${multi?`已选 ${sel.length} / ${cs.max}`:(sel.length?("已选："+esc(String(sel[0]))):"尚未选择（将默认取第一项）")}</div></div>`
}
function choiceSummary(sel){
  const p=sel&&sel.selectionPayload;if(!p)return "";
  const m=match(),b=[];
  if(p.option)b.push("选项："+p.option);
  if(p.options&&p.options.length)b.push("选项："+p.options.join("、"));
  if(p.envTag)b.push("环境标签："+p.envTag);
  if(p.envTags&&p.envTags.length)b.push("环境标签："+p.envTags.join("、"));

  if(p.hazardIds&&p.hazardIds.length)b.push("环境危害："+p.hazardIds.join("、"));
  if(p.targetAbilityId&&m&&m.players[sel.actor])b.push("能力："+m.players[sel.actor].ability.name);
  return b.length?`<div class="small" style="color:#aaf1c7">${b.map(esc).join("；")}</div>`:""
}

async function lockHex(){
 const o=ui.overlay,m=match(),h=o.pool[o.selected];
 if(!h)return toast("请先选择一张海克斯");
 let payload={};
 if(h.effectMode==="CHOICE"){
  const cs=choiceSchemaOf(h);
  if(cs.type==="SELECT_OWN_ABILITY"){
   payload={targetAbilityId:m.players[o.actor].ability.id}
  }else{
   const multi=(cs.max||1)>1;
   let vals=multi?(o.choices||[]):(o.choice!=null?[o.choice]:[]);
   if(!vals.length){const opts=choiceOptions(cs,m,o.actor);if(opts.length)vals=[opts[0].value]} // 无选择时取首项，保证可锁定
   if(cs.type==="SELECT_OPTION")payload=multi?{options:vals}:{option:vals[0]};
   else if(cs.type==="SELECT_ENVIRONMENT_TAG")payload=multi?{envTags:vals}:{envTag:vals[0]};
   else if(cs.type==="SELECT_ENVIRONMENT_HAZARD")payload=multi?{hazardIds:vals}:{hazardId:vals[0]};
   else payload={}
  }
 }
 await service.applyHex(m,o.actor,h,o.pool,payload,o.reroll);
 if(o.actor==="A"){
  const node=service.currentNode(m),pool=service.drawHex(m,"B",node,0,0);
  m.currentOfferHistory.B=[clone(pool)];
  await setHexDraft(m,{round:o.round,stage:"HANDOFF",actor:"B",pool:clone(pool),rerollsUsed:0,relaxLevel:0});
  ui.overlay={type:"HANDOFF",round:o.round};render()
 }else{

}

// 效果模式契约：引擎仅实现 PASSIVE / CHOICE / QUEST 三种。
// - PASSIVE：锁定即生效，不弹任务、不选目标（默认）
// - CHOICE ：需选择目标（如 SELECT_OWN_ABILITY）
// - QUEST  ：需先完成任务再获得奖励
// 历史内容曾使用 ACTIVE / TRIGGERED / ONCE 等命名，但引擎从未消费它们，
// 一律按 PASSIVE 处理。这里在导入与保存边界显式归并，避免误导性「活动」标签继续存在。
function normalizeEffectMode(mode){
  const m=String(mode==null?"":mode).trim().toUpperCase();
  if(m==="PASSIVE"||m==="CHOICE"||m==="QUEST")return m;
  if(m==="ACTIVE"||m==="TRIGGERED"||m==="ONCE")return "PASSIVE";
  return "PASSIVE"; // 未知值一律视作被动，绝不静默生效
}
function normalizeImportType(v){
 const x=String(v||"").trim().toLowerCase();
 const map={
  "角色":"characters","character":"characters","characters":"characters",
  "能力":"abilities","ability":"abilities","abilities":"abilities",
  "缺陷":"weaknesses","weakness":"weaknesses","weaknesses":"weaknesses",
  "环境":"environments","environment":"environments","environments":"environments",
  "环境事件":"events","事件":"events","event":"events","events":"events",
  "胜利条件":"victories","victory":"victories","victories":"victories",
  "海克斯":"hexes","hex":"hexes","hexes":"hexes"
 };
 return map[x]||null
}
function csvSplitLine(line){
 const out=[];let cur="",q=false;
 for(let i=0;i<line.length;i++){
  const c=line[i];
  if(c==='"'&&line[i+1]==='"'){cur+='"';i++;continue}
  if(c==='"'){q=!q;continue}
  if(c===","&&!q){out.push(cur);cur="";continue}
  cur+=c
 }
 out.push(cur);return out
}
function parseBatchText(text,filename){
 const lower=filename.toLowerCase(),records=[];
 if(lower.endsWith(".json")){
  const data=JSON.parse(text);
  if(Array.isArray(data)){
   for(const row of data){const type=normalizeImportType(row.type);if(type)records.push({...row,type})}
  }else{
   for(const [key,items] of Object.entries(data)){const type=normalizeImportType(key);if(type&&Array.isArray(items))for(const row of items)records.push({...row,type})}
  }
 }else{
  const lines=text.replace(/\r/g,"").split("\n").filter(x=>x.trim());
  if(lines.length<2)throw new Error("CSV 至少需要表头和一行数据");
  const headers=csvSplitLine(lines[0]).map(x=>x.trim());
  for(const line of lines.slice(1)){
   const vals=csvSplitLine(line),row={};headers.forEach((h,i)=>row[h]=vals[i]??"");
   const type=normalizeImportType(row.type||row.类型);if(!type)continue;
   const tags=String(row.tags||row.标签||"").split(/[|，,]/).map(x=>x.trim()).filter(Boolean);
   records.push({type,name:row.name||row.名称,shortText:row.shortText||row.短描述||"",description:row.description||row.完整描述||"",tags,tier:row.tier||row.品质,category:row.category||row.类别,effectMode:normalizeEffectMode(row.effectMode||row.效果模式),weight:Number(row.weight||row.权重||1)})
  }
 }
 return records
}
async function batchImport(){
 const input=document.createElement("input");input.type="file";input.accept=".json,.csv,application/json,text/csv";
 input.onchange=async()=>{
  const f=input.files?.[0];if(!f)return;
  try{
   const records=parseBatchText(await f.text(),f.name);
   if(!records.length)throw new Error("没有识别到角色、能力、缺陷、环境、环境事件、胜利条件或海克斯");
   const poolName=prompt("为本次批量导入创建内容池名称：",f.name.replace(/\.[^.]+$/,""))||f.name.replace(/\.[^.]+$/,"");
   const idsByType={characters:[],abilities:[],weaknesses:[],environments:[],events:[],victories:[],hexes:[]};
   const imported=[],reused=[];
   for(const row of records){
    if(!row.name?.trim())continue;
    const type=row.type;
    // 按「类型 + 归一化名称」去重：命中既有内容则复用其 id，不新建副本
    const existing=store.findByName(type,row.name,imported);
    if(existing){reused.push(existing);idsByType[type].push(existing.id);continue}
    const item={
     id:row.id&&String(row.id).trim()?String(row.id).trim():nextId(type),
     type,name:String(row.name).trim(),shortText:String(row.shortText||""),description:String(row.description||row.shortText||""),
     tags:Array.isArray(row.tags)?row.tags:String(row.tags||"").split(/[|，,]/).map(x=>x.trim()).filter(Boolean),enabled:row.enabled!==false
    };
    if(type==="environments"){item.hazards=Array.isArray(row.hazards)?row.hazards:[]}
    if(type==="events"){Object.assign(item,{compatibleEnvironmentTags:Array.isArray(row.compatibleEnvironmentTags)?row.compatibleEnvironmentTags:[],defaultPersistence:row.defaultPersistence==="CURRENT_NODE"?"CURRENT_NODE":"PERSISTENT"})}
    if(type==="hexes"){Object.assign(item,{tier:row.tier||"GOLD",category:row.category||"CORE",effectMode:normalizeEffectMode(row.effectMode),requirements:Array.isArray(row.requirements)?row.requirements:[],incompatibilities:Array.isArray(row.incompatibilities)?row.incompatibilities:[],weight:Number(row.weight)||1});if(row.choiceSchema)item.choiceSchema=row.choiceSchema}
    // Ensure ID uniqueness. If collision, allocate next available.
    if(store.content(type).some(x=>x.id===item.id)||imported.some(x=>x.type===type&&x.id===item.id))item.id=nextAvailableId(type,imported);
    await store.saveContent(item);idsByType[type].push(item.id);imported.push(item)
   }
   const total=imported.length+reused.length;
   if(!total)throw new Error("导入内容均无有效名称");
   const pool={id:nextId("pools"),type:"pools",name:poolName,description:`批量导入：${f.name}（${total} 项）`,scopeMode:"EXPLICIT",contentIdsByType:idsByType,excludedIdsByType:{},tagFiltersByType:{},enabled:true,source:{kind:"BATCH_IMPORT",fileName:f.name,importedAt:new Date().toISOString()}};
   await store.saveContent(pool);
   toast(`已导入 ${total} 项：新增 ${imported.length} 项${reused.length?`，复用同名 ${reused.length} 项`:""}，并创建内容池「${poolName}」`);
   ui.libraryType="pools";render()
  }catch(e){toast("批量导入失败："+e.message)}
 };
 input.click()
}
function nextAvailableId(type,pending=[]){
 const p=TYPE_META[type].prefix,used=new Set([...store.content(type),...pending.filter(x=>x.type===type)].map(x=>x.id));
 let n=1,id;do{id=p+String(n++).padStart(2,"0")}while(used.has(id));return id
}

// 通用计时环节：任何有时长、且不是引擎特殊流程（海克斯/环境事件/判票）的环节都可计时、可跳过
function isTimedSegment(n){return !!(n&&n.duration>0)&&!["HEX","EVENT","VOTE"].includes(n.type)}
// 环节预设：只提供默认值，不锁定类型——添加后名称与参数可随意改（陈词/总结/自由辩/质询/驳论…都只是"计时环节"）
const NODE_PRESETS=[
 {key:"prep",   type:"SEGMENT",name:"准备",     duration:180},
 {key:"speech", type:"SEGMENT",name:"陈词",     duration:90},
 {key:"cross",  type:"SEGMENT",name:"质询",     duration:60},
 {key:"free",   type:"SEGMENT",name:"自由辩",   duration:240,dual:true},

function makeNode(p,seq){
 const name=(p.type==="SEGMENT"&&seq>1)?p.name+" "+seq:p.name;
 const n={id:"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:p.type,name,duration:p.duration||0};
 if(p.dual)n.dual=true;
 if(p.config)n.config=clone(p.config);
 return n
}
function addNode(key){
 const p=NODE_PRESETS.find(x=>x.key===key);if(!p)return;
 const tl=ui.studioTimeline;
 const seq=tl.filter(n=>n.type===p.type&&String(n.name||"").startsWith(p.name)).length+1;
 tl.push(makeNode(p,seq));render()
}
function removeNode(i){ui.studioTimeline.splice(i,1);render()}
function moveNode(i,dir){const tl=ui.studioTimeline,j=i+dir;if(j<0||j>=tl.length)return;const t=tl[i];tl[i]=tl[j];tl[j]=t;render()}
function setNodeName(i,v){ui.studioTimeline[i].name=String(v||"").trim()||z(ui.studioTimeline[i].type)}
let _dragFrom=null;
function dragStart(i){_dragFrom=i;render()}
function dragOver(e){if(_dragFrom!==null)e.preventDefault()}
function dropNode(i){if(_dragFrom===null)return;const tl=ui.studioTimeline;if(_dragFrom!==i){const [it]=tl.splice(_dragFrom,1);tl.splice(i,0,it)}_dragFrom=null;render()}
function dragEnd(){_dragFrom=null;render()}
function validateTimeline(tl){
 if(!Array.isArray(tl)||!tl.length)return "至少需要 1 个环节";
 const ids=new Set();
 for(const n of tl){
  if(!n.id)return "存在缺少 id 的环节";
  if(ids.has(n.id))return "存在重复 id："+n.id;
  ids.add(n.id);
  if(n.type==="HEX"&&!(n.config?.tiers||[]).length)return "「"+(n.name||"海克斯选取")+"」未设置任何品质";
 }
 return null
}

 <section id="help-what" class="card help-section">
  <h2>1. 超级对决是什么？</h2>
  <p>超级对决是一套“构筑 + 辩论 + 临场变化”的训练。双方各自拥有一个角色、一项能力和一个缺陷，共享同一个环境与胜利条件。比赛过程中还会获得海克斯，并可能遭遇环境事件。</p>
  <div class="callout"><b>核心不是比较“谁设定更强”。</b>真正要证明的是：在当前环境、当前胜利条件和当前构筑下，我方的获胜路径为什么更稳定、更快、更难被对方破坏。</div>
 </section>

 <section id="help-elements" class="card help-section">
  <h2>2. 题面里的六种信息</h2>
  <div class="grid cols-3">
   <div class="item"><b>角色</b><p>角色的基础身体、装备、现实/虚构边界。没有写出的超自然能力不能自行补充。</p></div>
   <div class="item"><b>能力</b><p>角色额外获得的特殊能力。只按文字说明生效，不自动附赠相关装备或其他能力。</p></div>
   <div class="item"><b>缺陷</b><p>真实限制角色的负面条件。不能因为不利就忽略；可以通过战术、环境或海克斯降低影响。</p></div>
   <div class="item"><b>环境</b><p>双方共享的战场。环境中的危险、空间、路线、资源都可以进入论证。</p></div>
   <div class="item"><b>胜利条件</b><p>决定这一局“怎样才算赢”。不同胜利条件会彻底改变最优策略。</p></div>
   <div class="item"><b>海克斯</b><p>比赛过程中三选一获得的构筑强化。可能是被动、触发、一次性、任务、诅咒或规则改变。</p></div>
  </div>
 </section>

 <section id="help-flow" class="card help-section">
  <h2>3. 一局训练怎么进行？</h2>
  <div class="list">
   <div class="help-step"><div class="help-num">1</div><div><b>题面确认</b><p>双方先读清角色、能力、缺陷、环境和胜利条件。不要急着判断胜负，先找自己的获胜路径。</p></div></div>
   <div class="help-step"><div class="help-num">2</div><div><b>第一轮海克斯</b><p>A、B 分别秘密三选一。两边锁定后统一揭晓。</p></div></div>
   <div class="help-step"><div class="help-num">3</div><div><b>准备与立论</b><p>把角色事实、环境事实、能力机制连接起来，讲清楚“我方怎样具体达成胜利条件”。</p></div></div>
   <div class="help-step"><div class="help-num">4</div><div><b>第二轮海克斯 + 自由辩</b><p>根据前面的攻防重构 Build，集中攻击对方路径中最脆弱的一环。</p></div></div>
   <div class="help-step"><div class="help-num">5</div><div><b>环境事件</b><p>战场会发生变化，例如进水、停电、坍塌。事件生效后，要重新评估双方路径。</p></div></div>
   <div class="help-step"><div class="help-num">6</div><div><b>第三轮海克斯</b><p>可能出现高影响的棱彩、诅咒或任务海克斯。注意代价和触发条件。</p></div></div>
   <div class="help-step"><div class="help-num">7</div><div><b>总结、判票、复盘</b><p>最后比较双方完整获胜链条：谁的前提更少、速度更快、稳定性更高、对对方回应更充分。</p></div></div>
  </div>
 </section>

 <section id="help-argue" class="card help-section">
  <h2>4. 新手最容易上手的发言结构</h2>
  <div class="rule-box"><h3>建议使用“四步路径”</h3>
   <p><b>第一步：我要怎么赢。</b> 先直接说胜利条件对应的具体方案。</p>
   <p><b>第二步：为什么我做得到。</b> 用角色、能力和环境建立机制链。</p>
   <p><b>第三步：对方为什么拦不住。</b> 比较速度、信息、空间、资源和风险。</p>
   <p><b>第四步：我的缺陷为什么不会先让我失败。</b> 主动处理自己最危险的限制。</p>
  </div>
  <div class="grid cols-2" style="margin-top:14px">
   <div class="item"><b>好论证</b><p>“我有水下呼吸 → 环境持续进水 → 胜利条件是逃脱 → 我可以走对方无法长期使用的水下路线 → 因此我方路线更稳定。”</p></div>
   <div class="item"><b>弱论证</b><p>“我的角色比较强，所以我会赢。”这种说法没有连接环境、胜利条件，也没有解释机制。</p></div>
  </div>
 </section>

 <section id="help-hex" class="card help-section">
  <h2>5. 海克斯怎么理解？</h2>
  <div class="grid cols-3">
   <div class="item"><b>SILVER / 银</b><p>通常是稳定的小型强化，适合补基础短板。</p></div>
   <div class="item"><b>GOLD / 金</b><p>构筑核心，常用于协同、反制、弱点转化。</p></div>
   <div class="item"><b>PRISMATIC / 棱彩</b><p>高影响规则变化，可能直接改变获胜路径。</p></div>
   <div class="item"><b>CURSED / 诅咒</b><p>强收益伴随明确代价，必须把代价也纳入论证。</p></div>
   <div class="item"><b>QUEST / 任务</b><p>先完成任务，再获得奖励。未完成前不能把奖励当成已经拥有。</p></div>
   <div class="item"><b>前置条件</b><p>某些海克斯只有在角色、能力、缺陷、已有海克斯或环境满足条件时才会进入候选。</p></div>
  </div>
  <div class="callout" style="margin-top:12px"><b>秘密选择规则：</b>A 锁定后设备交给 B；B 完成选择前不能看到 A 的牌；双方锁定后才统一揭晓。投影端只显示已经揭晓的海克斯。</div>
 </section>

 <section id="help-coach" class="card help-section">
  <h2>6. 教练 / 主持需要做什么？</h2>
  <div class="grid cols-2">
   <div class="item"><b>推进流程</b><p>跟随当前节点操作计时、海克斯、环境事件和判票。计时节点未完成时，不应普通跳过。</p></div>
   <div class="item"><b>记录教练标记</b><p>记录有效进攻、机制清晰、有效回应、漏回应等关键时刻，方便 Review。</p></div>
   <div class="item"><b>处理误操作</b><p>使用撤销恢复最近一次可撤销状态。EventLog 会保留撤销审计，而不是删除历史。</p></div>
   <div class="item"><b>维护公平</b><p>不要替选手临场补充题面没有写出的能力；对于争议事实优先回到冻结题面和明确规则。</p></div>
  </div>
 </section>

 <section id="help-beginner" class="card help-section">
  <h2>7. 第一次训练怎么降低难度？</h2>
  <div class="quick-check">
   <div class="item"><b>只抓一条主路径</b><p>第一次不要同时讲五种赢法。选最现实的一条，讲完整。</p></div>
   <div class="item"><b>每次只问“然后呢？”</b><p>角色有能力，然后呢？能力影响环境，然后呢？最后如何直接接到胜利条件？</p></div>
   <div class="item"><b>把海克斯当“修补件”</b><p>优先选择能修复自己关键短板、加强主路径或直接反制对方核心机制的牌。</p></div>
  </div>
  <div class="rule-box" style="margin-top:14px"><h3>新手开局前 30 秒</h3><p>① 我的胜利条件是什么？　② 环境最重要的三个事实是什么？　③ 我的能力最直接帮助哪一步？　④ 我的缺陷最可能在哪里让我失败？　⑤ 第一轮海克斯我要补哪一个问题？</p></div>
 </section>
 </main>`)
}

async function exportData(){const matches={};for(const [id,m] of Object.entries(cache.matches)){const copy=structuredClone(m);if(copy.media)for(const k of ["characterA","characterB","environment"]){const v=copy.media[k];if(v&&!v.startsWith("data:")){try{const b=await db.getMedia(v);if(b)copy.media[k]=await blobToDataUrl(b)}catch{}}}matches[id]=copy}const payload={version:"0.5.0",content:cache.content,matches,currentMatchId:store.getLocal("currentMatchId"),setup:ensureSetup(),attribution:{author:APP_META.author,year:APP_META.year,codeLicense:APP_META.codeLicense,contentLicense:APP_META.contentLicense,note:APP_META.note}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="super-fight-v0.5.0-data.json";a.click();URL.revokeObjectURL(a.href)}
function importData(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
 input.onchange=async()=>{
  try{
   const data=JSON.parse(await input.files[0].text());
   if(data.content)for(const [type,items] of Object.entries(data.content))for(const item of items)await store.saveContent({...item,type:item.type||type});
   if(data.matches)for(const m of Object.values(data.matches)){cache.matches[m.id]=m;await db.put("matches",m)}
   if(data.currentMatchId)store.setCurrentMatch(data.currentMatchId);
   const setup=ensureSetup();setup.preview=null;store.setLocal("draftSetup",setup);
   toast("数据导入完成");render()
  }catch(e){toast("导入失败："+e.message)}
 };
 input.click()
}

function render(){
 if(!ui.ready){document.querySelector("#app").innerHTML=`<main class="wrap"><div class="card center"><h1>正在载入 SUPER FIGHT V0.5.0…</h1></div></main>`;return}
 ui.route=location.hash||"#/dashboard";
 if(ui.route.startsWith("#/dashboard"))dashboard();
 else if(ui.route.startsWith("#/setup"))setupPage();
 else if(ui.route.startsWith("#/lobby/"))lobby();
 else if(ui.route.startsWith("#/live/"))live();
 else if(ui.route.startsWith("#/projector/"))projector();
 else if(ui.route.startsWith("#/review/"))review();
 else if(ui.route.startsWith("#/library"))contentLibrary();
 else if(ui.route.startsWith("#/studio"))studio();
 else if(ui.route.startsWith("#/history"))history();
 else if(ui.route.startsWith("#/help"))helpPage();
 else if(ui.route.startsWith("#/about"))aboutPage();
 else dashboard()
}
window.addEventListener("hashchange",()=>{ui.overlay=null;render()});
window.addEventListener("storage",()=>render());
try{if(syncChannel)syncChannel.onmessage=e=>{if(ui.route.startsWith("#/projector/")&&(!e.data?.id||e.data.id===routeMatchId()))render()}}catch{}
(async()=>{try{await initData();ui.ready=true;render()}catch(e){document.querySelector("#app").innerHTML=`<main class="wrap"><div class="card"><h1>数据初始化失败</h1><p>${esc(e.message)}</p></div></main>`;console.error(e)}})();
</script>
